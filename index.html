<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>5 Cents Intelligence</title>
    <meta
      name="description"
      content="A future-facing teaser for 5 Cents Intelligence."
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #06101d;
        --panel: rgba(9, 18, 33, 0.76);
        --text: #f8fafc;
        --muted: #94a3b8;
        --line: rgba(148, 163, 184, 0.14);
        --cyan: #7dd3fc;
        --green: #34d399;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.14), transparent 24%),
          radial-gradient(circle at 80% 30%, rgba(52, 211, 153, 0.08), transparent 30%),
          linear-gradient(180deg, #06101d 0%, #081425 44%, #0d1728 100%);
        color: var(--text);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(circle at center, black 28%, transparent 82%);
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 0;
      }

      .hero {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 36px;
        background: linear-gradient(180deg, rgba(10, 18, 32, 0.88), rgba(8, 16, 29, 0.7));
        box-shadow: 0 30px 90px rgba(2, 6, 23, 0.42);
        overflow: hidden;
        position: relative;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto -10% -18% auto;
        width: 420px;
        height: 420px;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.16), transparent 66%);
        filter: blur(18px);
      }

      .inner {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(340px, 0.88fr);
        gap: 24px;
        align-items: center;
        padding: 34px;
      }

      .eyebrow {
        color: var(--cyan);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.36em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 0;
        font-size: clamp(3rem, 7vw, 6.4rem);
        line-height: 0.93;
        letter-spacing: -0.05em;
      }

      .intro {
        max-width: 560px;
        margin: 18px 0 0;
        color: #cbd5e1;
        font-size: 1.12rem;
        line-height: 1.75;
      }

      .stamp {
        margin-top: 28px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        border: 1px solid rgba(125, 211, 252, 0.16);
        border-radius: 9999px;
        background: rgba(15, 23, 42, 0.6);
        padding: 10px 16px;
        color: #dbeafe;
        font-size: 0.9rem;
      }

      .stamp-dot {
        width: 10px;
        height: 10px;
        border-radius: 9999px;
        background: linear-gradient(180deg, var(--cyan), var(--green));
        box-shadow: 0 0 0 6px rgba(125, 211, 252, 0.08);
      }

      .art {
        display: grid;
        place-items: center;
        padding: 18px;
      }

      .art-frame {
        width: min(100%, 520px);
        border-radius: 32px;
        border: 1px solid rgba(148, 163, 184, 0.12);
        background: linear-gradient(180deg, rgba(10, 18, 32, 0.94), rgba(7, 14, 26, 0.9));
        padding: 18px;
      }

      .art-frame img {
        display: block;
        width: 100%;
        height: auto;
      }

      .footer-note {
        margin-top: 22px;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.7;
      }

      @media (max-width: 940px) {
        .inner {
          grid-template-columns: 1fr;
          padding: 26px;
        }

        .art {
          order: -1;
          padding: 4px 0 0;
        }

        h1 {
          font-size: clamp(2.5rem, 12vw, 4.6rem);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-label="5 Cents Intelligence teaser">
        <div class="inner">
          <div>
            <div class="eyebrow">5cents-intelligence.com</div>
            <h1>Something thoughtful is taking shape.</h1>
            <div class="stamp">
              <span class="stamp-dot"></span>
              <span>Teaser release 2026.08.01.2.1</span>
            </div>
            <p class="footer-note">
              The direction is still forming. For now, this page exists to signal intent.
            </p>
          </div>

          <div class="art">
            <div class="art-frame">
              <img src="logo.svg" alt="5 Cents Intelligence Orbit Nickel Minimal logo" />
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
