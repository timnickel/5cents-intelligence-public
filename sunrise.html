<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>5 Cents Intelligence</title>
    <meta name="description" content="Sunrise teaser image for 5 Cents Intelligence." />
    <style>
      :root {
        color-scheme: dark;
        background: #020617;
