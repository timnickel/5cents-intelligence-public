<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Investments · 5 Cents Intelligence</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06101d;
        --panel: rgba(9, 18, 33, 0.76);
        --text: #f8fafc;
        --muted: #94a3b8;
        --line: rgba(148, 163, 184, 0.14);
        --cyan: #7dd3fc;
        --green: #34d399;
        --red: #f87171;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.14), transparent 24%),
          radial-gradient(circle at 80% 30%, rgba(52, 211, 153, 0.08), transparent 30%),
          linear-gradient(180deg, #06101d 0%, #081425 44%, #0d1728 100%);
        color: var(--text);
      }

      main {
        width: min(680px, calc(100% - 32px));
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 0;
      }

      .hero {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(10, 18, 32, 0.9), rgba(8, 16, 29, 0.76));
        box-shadow: 0 30px 90px rgba(2, 6, 23, 0.42);
        padding: 34px;
      }

      .eyebrow {
        color: var(--cyan);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.36em;
        text-transform: uppercase;
        margin: 0;
      }

      h1 {
        margin: 14px 0 0;
        font-size: clamp(1.8rem, 4vw, 2.6rem);
        letter-spacing: -0.02em;
      }

      .intro {
        margin: 12px 0 0;
        color: #cbd5e1;
        line-height: 1.6;
      }

      form {
        display: flex;
        gap: 10px;
        margin-top: 22px;
      }

      input[type="password"] {
        flex: 1;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(6, 12, 22, 0.7);
        color: var(--text);
        font-size: 1rem;
      }

      button {
        padding: 12px 20px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(180deg, var(--cyan), var(--green));
        color: #06101d;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.05);
      }

      .gate-error {
        margin-top: 14px;
        color: var(--red);
        font-size: 0.9rem;
      }

      #content h2 {
        font-size: 1.3rem;
        margin: 24px 0 8px;
      }

      #content h2:first-child {
        margin-top: 0;
      }

      #content p {
        color: #cbd5e1;
        line-height: 1.7;
        margin: 0 0 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="hero">
        <div id="gate">
          <p class="eyebrow">Private</p>
          <h1>Investment Planning</h1>
          <p class="intro">Enter the passcode to continue.</p>
          <form id="passcode-form">
            <input
              type="password"
              id="passcode-input"
              name="passcode"
              autocomplete="off"
              placeholder="Passcode"
              required
            />
            <button type="submit">Unlock</button>
          </form>
          <p id="gate-error" class="gate-error" hidden></p>
        </div>
        <div id="content" hidden></div>
      </div>
    </main>
    <script>
      (function () {
        var gate = document.getElementById("gate");
        var content = document.getElementById("content");
        var form = document.getElementById("passcode-form");
        var input = document.getElementById("passcode-input");
        var errorEl = document.getElementById("gate-error");

        function renderContent(data) {
          content.innerHTML = "";
          (data && data.sections ? data.sections : []).forEach(function (section) {
            var h2 = document.createElement("h2");
            h2.textContent = section.title;
            var p = document.createElement("p");
            p.textContent = section.body;
            content.appendChild(h2);
            content.appendChild(p);
          });
          gate.hidden = true;
          content.hidden = false;
        }

        function checkSession() {
          return fetch("/api/investments-content", { credentials: "same-origin" })
            .then(function (res) {
              if (!res.ok) return null;
              return res.json();
            })
            .then(function (data) {
              if (data) renderContent(data.content);
            })
            .catch(function () {
              /* stay on the passcode gate */
            });
        }

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          errorEl.hidden = true;
          var passcode = input.value;
          fetch("/api/investments-auth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ passcode: passcode }),
          })
            .then(function (res) {
              input.value = "";
              if (!res.ok) {
                errorEl.textContent = "Incorrect passcode.";
                errorEl.hidden = false;
                return null;
              }
              return checkSession();
            })
            .catch(function () {
              errorEl.textContent = "Something went wrong. Try again.";
              errorEl.hidden = false;
            });
        });

        checkSession();
      })();
    </script>
  </body>
</html>
