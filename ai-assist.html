<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AI Assist · 5 Cents Intelligence</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06101d;
        --panel: rgba(9, 18, 33, 0.76);
        --text: #f8fafc;
        --muted: #94a3b8;
        --line: rgba(148, 163, 184, 0.14);
        --cyan: #7dd3fc;
        --green: #34d399;
        --red: #f87171;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.14), transparent 24%),
          radial-gradient(circle at 80% 30%, rgba(52, 211, 153, 0.08), transparent 30%),
          linear-gradient(180deg, #06101d 0%, #081425 44%, #0d1728 100%);
        color: var(--text);
      }

      main {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 0;
      }

      .layout {
        width: 100%;
        display: flex;
        align-items: flex-start;
        gap: 24px;
      }

      .hero {
        width: 100%;
        max-width: 560px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(10, 18, 32, 0.9), rgba(8, 16, 29, 0.76));
        box-shadow: 0 30px 90px rgba(2, 6, 23, 0.42);
        padding: 34px;
      }

      @media (max-width: 860px) {
        .layout {
          flex-direction: column;
        }

        .hero {
          max-width: none;
        }
      }

      .eyebrow {
        color: var(--cyan);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.36em;
        text-transform: uppercase;
        margin: 0;
        text-align: center;
      }

      .mascot-wrap {
        display: flex;
        justify-content: center;
        margin: 18px 0 6px;
      }

      .mascot-glow {
        position: relative;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 40%, rgba(125, 211, 252, 0.32), rgba(52, 211, 153, 0) 70%);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: mascot-float 3.4s ease-in-out infinite;
      }

      .mascot-glow img {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 22%;
        background: #0a0a0c;
        box-shadow:
          0 0 0 2px rgba(125, 211, 252, 0.5),
          0 8px 24px rgba(2, 6, 23, 0.55);
        transition: transform 0.2s ease;
      }

      .mascot-glow:hover img {
        transform: scale(1.05) rotate(-3deg);
      }

      @keyframes mascot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      h1 {
        margin: 4px 0 0;
        font-size: clamp(1.6rem, 4vw, 2.1rem);
        letter-spacing: -0.02em;
        text-align: center;
      }

      .intro {
        margin: 10px 0 0;
        color: #cbd5e1;
        line-height: 1.6;
        text-align: center;
        font-size: 0.92rem;
      }

      textarea {
        width: 100%;
        min-height: 7rem;
        margin-top: 22px;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(6, 12, 22, 0.7);
        color: var(--text);
        font-size: 1rem;
        font-family: inherit;
        resize: vertical;
      }

      textarea::placeholder {
        color: var(--muted);
      }

      .row {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }

      button {
        flex: 1;
        padding: 12px 20px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(180deg, var(--cyan), var(--green));
        color: #06101d;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.05);
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      button.secondary {
        flex: none;
        background: rgba(15, 23, 42, 0.6);
        color: var(--text);
        border: 1px solid var(--line);
      }

      #result {
        margin-top: 20px;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(6, 12, 22, 0.7);
        min-height: 1.5rem;
        white-space: pre-wrap;
      }

      #result.empty {
        color: var(--muted);
      }

      #result.error {
        color: var(--red);
      }

      .hint {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 8px;
      }

      #history {
        margin-top: 28px;
      }

      #history h2 {
        font-size: 0.95rem;
        margin: 0 0 12px;
        color: #cbd5e1;
      }

      .history-item {
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(6, 12, 22, 0.55);
        margin-bottom: 10px;
      }

      .history-question {
        font-size: 0.85rem;
        color: var(--muted);
        white-space: pre-wrap;
      }

      .history-answer {
        margin-top: 6px;
        white-space: pre-wrap;
      }

      .history-time {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 6px;
      }

      .history-empty {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .page-version {
        margin: 28px 0 0;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.76rem;
        letter-spacing: 0.02em;
        text-align: center;
      }

      #debug {
        flex: 1 1 360px;
        max-width: 420px;
        position: sticky;
        top: 32px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(6, 12, 22, 0.7);
        padding: 20px;
      }

      @media (max-width: 860px) {
        #debug {
          max-width: none;
          position: static;
        }
      }

      .debug-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }

      .debug-header h2 {
        margin: 0;
        font-size: 0.95rem;
        color: #cbd5e1;
      }

      .debug-actions {
        display: flex;
        gap: 8px;
      }

      button.small {
        flex: none;
        padding: 6px 12px;
        font-size: 0.78rem;
      }

      #debugLog {
        margin: 0;
        max-height: 60vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: "Consolas", "Menlo", monospace;
        font-size: 0.76rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="layout">
        <div class="hero">
          <p class="eyebrow">Private</p>
          <div class="mascot-wrap">
            <div class="mascot-glow">
              <img src="/robot.png" alt="AI Assist robot mascot waving" />
            </div>
          </div>
          <h1>AI Assist</h1>
          <p class="intro">Extracts a single clear next action from whatever you paste in.</p>
          <textarea id="message" placeholder="Type or paste a message, idea, or note..." autofocus></textarea>
          <div class="row">
            <button id="submit">Process</button>
            <button id="settings" class="secondary" title="Change passphrase">&#128273;</button>
          </div>
          <div id="result" class="empty">Result will appear here.</div>
          <div id="history">
            <h2>History</h2>
            <div id="historyList"></div>
          </div>
          <p class="page-version">v2026.08.08.2.0</p>
        </div>
        <div id="debug">
          <div class="debug-header">
            <h2>Debug Log</h2>
            <div class="debug-actions">
              <button id="copyDebug" class="secondary small">Copy</button>
              <button id="clearDebug" class="secondary small">Clear</button>
            </div>
          </div>
          <pre id="debugLog">No requests yet.</pre>
        </div>
      </div>
    </main>
    <script>
      var SECRET_KEY = "ai-assist-secret";
      var HISTORY_KEY = "ai-assist-history";
      var HISTORY_LIMIT = 50;
      var messageEl = document.getElementById("message");
      var submitEl = document.getElementById("submit");
      var settingsEl = document.getElementById("settings");
      var resultEl = document.getElementById("result");
      var historyListEl = document.getElementById("historyList");
      var debugLogEl = document.getElementById("debugLog");
      var clearDebugEl = document.getElementById("clearDebug");
      var copyDebugEl = document.getElementById("copyDebug");
      var debugEntries = [];

      function logDebug(label, data) {
        var entry = "[" + new Date().toLocaleTimeString() + "] " + label;
        if (data !== undefined) {
          entry += "\n" + (typeof data === "string" ? data : JSON.stringify(data, null, 2));
        }
        debugEntries.unshift(entry);
        debugLogEl.textContent = debugEntries.join("\n\n---\n\n");
      }

      clearDebugEl.addEventListener("click", function () {
        debugEntries = [];
        debugLogEl.textContent = "No requests yet.";
      });

      copyDebugEl.addEventListener("click", function () {
        navigator.clipboard.writeText(debugLogEl.textContent).then(function () {
          var original = copyDebugEl.textContent;
          copyDebugEl.textContent = "Copied!";
          setTimeout(function () {
            copyDebugEl.textContent = original;
          }, 1500);
        });
      });

      function getHistory() {
        try {
          return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        } catch (e) {
          return [];
        }
      }

      function addToHistory(message, action) {
        var history = getHistory();
        history.unshift({ message: message, action: action, time: Date.now() });
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, HISTORY_LIMIT)));
        renderHistory();
      }

      function escapeHtml(str) {
        var div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function renderHistory() {
        var history = getHistory();
        if (history.length === 0) {
          historyListEl.innerHTML = '<p class="history-empty">No messages yet.</p>';
          return;
        }
        historyListEl.innerHTML = history
          .map(function (entry) {
            return (
              '<div class="history-item">' +
              '<div class="history-question">' + escapeHtml(entry.message) + "</div>" +
              '<div class="history-answer">' + escapeHtml(entry.action) + "</div>" +
              '<div class="history-time">' + new Date(entry.time).toLocaleString() + "</div>" +
              "</div>"
            );
          })
          .join("");
      }

      function promptForSecret() {
        var value = window.prompt("Enter your AI Assist passphrase:");
        if (value) {
          localStorage.setItem(SECRET_KEY, value);
        }
        return value;
      }

      function getSecret() {
        var secret = localStorage.getItem(SECRET_KEY);
        if (!secret) {
          secret = promptForSecret();
        }
        return secret;
      }

      settingsEl.addEventListener("click", function () {
        promptForSecret();
      });

      function submit() {
        var message = messageEl.value.trim();
        if (!message) return;

        var secret = getSecret();
        if (!secret) return;

        submitEl.disabled = true;
        submitEl.textContent = "Processing...";
        resultEl.className = "empty";
        resultEl.textContent = "Thinking...";

        var requestHeaders = {
          "Content-Type": "application/json",
          "X-AI-Assist-Secret": secret,
        };
        logDebug("Request \u2192 POST /api/ai-assist-process", {
          headers: requestHeaders,
          body: { message: message },
        });

        fetch("/api/ai-assist-process", {
          method: "POST",
          headers: requestHeaders,
          body: JSON.stringify({ message: message }),
        })
          .then(function (response) {
            return response.text().then(function (rawText) {
              var responseHeaders = {};
              response.headers.forEach(function (value, key) {
                responseHeaders[key] = value;
              });
              logDebug("Response \u2190 " + response.status + " " + response.statusText, {
                headers: responseHeaders,
                body: rawText,
              });

              var data;
              try {
                data = rawText ? JSON.parse(rawText) : {};
              } catch (e) {
                data = { error: "Invalid JSON response" };
              }

              if (response.status === 401) {
                localStorage.removeItem(SECRET_KEY);
                resultEl.className = "error";
                resultEl.textContent = "Wrong passphrase. Try again.";
                return null;
              }
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (!result) return;
            if (!result.ok) {
              resultEl.className = "error";
              resultEl.textContent = result.data.details
                ? result.data.error + ": " + result.data.details
                : result.data.error || "Something went wrong.";
              return;
            }
            var action = result.data.action || "(no action returned)";
            resultEl.className = "";
            resultEl.textContent = action;
            addToHistory(message, action);
            messageEl.value = "";
          })
          .catch(function (error) {
            logDebug("Error", error && error.message ? error.message : String(error));
            resultEl.className = "error";
            resultEl.textContent = "Network error. Try again.";
          })
          .finally(function () {
            submitEl.disabled = false;
            submitEl.textContent = "Process";
          });
      }

      submitEl.addEventListener("click", submit);
      messageEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
          submit();
        }
      });

      renderHistory();
    </script>
  </body>
</html>
