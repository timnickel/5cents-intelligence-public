<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AI Assist · 5 Cents Intelligence</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06101d;
        --panel: rgba(9, 18, 33, 0.76);
        --text: #f8fafc;
        --muted: #94a3b8;
        --line: rgba(148, 163, 184, 0.14);
        --cyan: #7dd3fc;
        --green: #34d399;
        --red: #f87171;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.14), transparent 24%),
          radial-gradient(circle at 80% 30%, rgba(52, 211, 153, 0.08), transparent 30%),
          linear-gradient(180deg, #06101d 0%, #081425 44%, #0d1728 100%);
        color: var(--text);
      }

      main {
        width: min(1400px, calc(100% - 32px));
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 0;
      }

      .layout {
        width: 100%;
        display: flex;
        align-items: flex-start;
        gap: 24px;
      }

      .hero {
        width: 100%;
        max-width: 560px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(10, 18, 32, 0.9), rgba(8, 16, 29, 0.76));
        box-shadow: 0 30px 90px rgba(2, 6, 23, 0.42);
        padding: 34px;
      }

      @media (max-width: 860px) {
        .layout {
          flex-direction: column;
        }

        .hero {
          max-width: none;
          order: 1;
        }

        #memory {
          order: 2;
        }

        #debug {
          order: 3;
        }
      }

      .eyebrow {
        color: var(--cyan);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.36em;
        text-transform: uppercase;
        margin: 0;
        text-align: center;
      }

      .mascot-wrap {
        display: flex;
        justify-content: center;
        margin: 18px 0 6px;
      }

      .mascot-glow {
        position: relative;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 40%, rgba(125, 211, 252, 0.32), rgba(52, 211, 153, 0) 70%);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: mascot-float 3.4s ease-in-out infinite;
      }

      .mascot-glow img {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 22%;
        background: #0a0a0c;
        box-shadow:
          0 0 0 2px rgba(125, 211, 252, 0.5),
          0 8px 24px rgba(2, 6, 23, 0.55);
        transition: transform 0.2s ease;
      }

      .mascot-glow:hover img {
        transform: scale(1.05) rotate(-3deg);
      }

      @keyframes mascot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      h1 {
        margin: 4px 0 0;
        font-size: clamp(1.6rem, 4vw, 2.1rem);
        letter-spacing: -0.02em;
        text-align: center;
      }

      .intro {
        margin: 10px 0 0;
        color: #cbd5e1;
        line-height: 1.6;
        text-align: center;
        font-size: 0.92rem;
      }

      textarea {
        width: 100%;
        min-height: 7rem;
        margin-top: 22px;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(6, 12, 22, 0.7);
        color: var(--text);
        font-size: 1rem;
        font-family: inherit;
        resize: vertical;
      }

      textarea::placeholder {
        color: var(--muted);
      }

      .row {
        display: flex;
        gap: 10px;
        margin-top: 12px;
      }

      button {
        flex: 1;
        padding: 12px 20px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(180deg, var(--cyan), var(--green));
        color: #06101d;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.05);
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      button.secondary {
        flex: none;
        background: rgba(15, 23, 42, 0.6);
        color: var(--text);
        border: 1px solid var(--line);
      }

      #status {
        margin-top: 20px;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(6, 12, 22, 0.7);
        white-space: pre-wrap;
        color: var(--muted);
      }

      #status:empty {
        display: none;
        margin: 0;
        padding: 0;
        border: none;
      }

      #status.error {
        color: var(--red);
      }

      #transcript {
        margin-top: 20px;
      }

      #options {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      #options:empty {
        display: none;
      }

      button.option {
        flex: none;
        padding: 9px 16px;
        border-radius: 999px;
        background: rgba(125, 211, 252, 0.12);
        color: var(--cyan);
        border: 1px solid rgba(125, 211, 252, 0.4);
        font-size: 0.85rem;
        font-weight: 600;
      }

      button.option:hover {
        background: rgba(125, 211, 252, 0.22);
      }

      button.option:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .hint {
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 8px;
      }

      #threads {
        margin-top: 28px;
      }

      #threads h2 {
        font-size: 0.95rem;
        margin: 0 0 12px;
        color: #cbd5e1;
      }

      .thread-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(6, 12, 22, 0.55);
        margin-bottom: 8px;
        cursor: pointer;
      }

      .thread-item:hover {
        background: rgba(6, 12, 22, 0.8);
      }

      .thread-item.active {
        border-color: rgba(125, 211, 252, 0.5);
        background: rgba(125, 211, 252, 0.08);
      }

      .thread-info {
        flex: 1;
        min-width: 0;
      }

      .thread-title {
        font-size: 0.88rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .thread-time {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 2px;
      }

      button.thread-delete {
        flex: none;
        padding: 4px 8px;
        font-size: 0.75rem;
        background: rgba(248, 113, 113, 0.12);
        color: var(--red);
        border: 1px solid rgba(248, 113, 113, 0.3);
        border-radius: 8px;
      }

      button.thread-delete:hover {
        background: rgba(248, 113, 113, 0.22);
      }

      .history-item {
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(6, 12, 22, 0.55);
        margin-bottom: 10px;
      }

      .history-question {
        font-size: 0.85rem;
        color: var(--muted);
        white-space: pre-wrap;
      }

      .history-answer {
        margin-top: 6px;
        white-space: pre-wrap;
      }

      .history-time {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 6px;
      }

      .history-empty {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .page-version {
        margin: 28px 0 0;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.76rem;
        letter-spacing: 0.02em;
        text-align: center;
      }

      #debug {
        flex: 1 1 360px;
        max-width: 420px;
        position: sticky;
        top: 32px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(6, 12, 22, 0.7);
        padding: 20px;
      }

      @media (max-width: 860px) {
        #debug {
          max-width: none;
          position: static;
        }
      }

      #memory {
        flex: 1 1 280px;
        max-width: 320px;
        position: sticky;
        top: 32px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(6, 12, 22, 0.7);
        padding: 20px;
      }

      @media (max-width: 860px) {
        #memory {
          max-width: none;
          position: static;
        }
      }

      .memory-header {
        margin: 0 0 10px;
        font-size: 0.95rem;
        color: #cbd5e1;
      }

      #memoryContent {
        margin: 0;
        max-height: 60vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.85rem;
        line-height: 1.5;
        color: var(--text);
      }

      #memoryContent.empty {
        color: var(--muted);
      }

      .debug-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }

      .debug-header h2 {
        margin: 0;
        font-size: 0.95rem;
        color: #cbd5e1;
      }

      .debug-actions {
        display: flex;
        gap: 8px;
      }

      button.small {
        flex: none;
        padding: 6px 12px;
        font-size: 0.78rem;
      }

      #debugLog {
        margin: 0;
        max-height: 60vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: "Consolas", "Menlo", monospace;
        font-size: 0.76rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="layout">
        <div id="memory">
          <h2 class="memory-header">Memory</h2>
          <div id="memoryContent" class="empty">No memory yet.</div>
        </div>
        <div class="hero">
          <p class="eyebrow">Private</p>
          <div class="mascot-wrap">
            <div class="mascot-glow">
              <img src="/robot.png" alt="AI Assist robot mascot waving" />
            </div>
          </div>
          <h1>AI Assist</h1>
          <p class="intro">Extracts a single clear next action from whatever you paste in.</p>
          <textarea id="message" placeholder="Type or paste a message, idea, or note..." autofocus></textarea>
          <div class="row">
            <button id="submit">Process</button>
            <button id="newChat" class="secondary" title="Start a new thread">+ New</button>
            <button id="settings" class="secondary" title="Change passphrase">&#128273;</button>
          </div>
          <div id="status"></div>
          <div id="options"></div>
          <div id="transcript"></div>
          <div id="threads">
            <h2>Threads</h2>
            <div id="threadList"></div>
          </div>
          <p class="page-version">v2026.08.08.6.0</p>
        </div>
        <div id="debug">
          <div class="debug-header">
            <h2>Debug Log</h2>
            <div class="debug-actions">
              <button id="copyDebug" class="secondary small">Copy</button>
              <button id="clearDebug" class="secondary small">Clear</button>
            </div>
          </div>
          <pre id="debugLog">No requests yet.</pre>
        </div>
      </div>
    </main>
    <script>
      var SECRET_KEY = "ai-assist-secret";
      var THREADS_KEY = "ai-assist-threads";
      var THREADS_LIMIT = 50;
      var TITLE_LENGTH = 60;
      var messageEl = document.getElementById("message");
      var submitEl = document.getElementById("submit");
      var newChatEl = document.getElementById("newChat");
      var settingsEl = document.getElementById("settings");
      var statusEl = document.getElementById("status");
      var transcriptEl = document.getElementById("transcript");
      var optionsEl = document.getElementById("options");
      var threadListEl = document.getElementById("threadList");
      var memoryContentEl = document.getElementById("memoryContent");
      var debugLogEl = document.getElementById("debugLog");
      var clearDebugEl = document.getElementById("clearDebug");
      var copyDebugEl = document.getElementById("copyDebug");
      var debugEntries = [];
      var conversation = [];
      var currentThreadId = null;
      var currentMemory = "";

      function logDebug(label, data) {
        var entry = "[" + new Date().toLocaleTimeString() + "] " + label;
        if (data !== undefined) {
          entry += "\n" + (typeof data === "string" ? data : JSON.stringify(data, null, 2));
        }
        debugEntries.unshift(entry);
        debugLogEl.textContent = debugEntries.join("\n\n---\n\n");
      }

      clearDebugEl.addEventListener("click", function () {
        debugEntries = [];
        debugLogEl.textContent = "No requests yet.";
      });

      copyDebugEl.addEventListener("click", function () {
        navigator.clipboard.writeText(debugLogEl.textContent).then(function () {
          var original = copyDebugEl.textContent;
          copyDebugEl.textContent = "Copied!";
          setTimeout(function () {
            copyDebugEl.textContent = original;
          }, 1500);
        });
      });

      function escapeHtml(str) {
        var div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function generateId() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return "t" + Date.now() + Math.random().toString(16).slice(2);
      }

      function getThreads() {
        try {
          return JSON.parse(localStorage.getItem(THREADS_KEY)) || [];
        } catch (e) {
          return [];
        }
      }

      function saveThreads(threads) {
        localStorage.setItem(THREADS_KEY, JSON.stringify(threads.slice(0, THREADS_LIMIT)));
      }

      function makeTitle(text) {
        var flat = text.trim().replace(/\s+/g, " ");
        return flat.length > TITLE_LENGTH ? flat.slice(0, TITLE_LENGTH - 1) + "…" : flat;
      }

      function persistCurrentThread(options, memory) {
        var threads = getThreads().filter(function (t) {
          return t.id !== currentThreadId;
        });
        threads.unshift({
          id: currentThreadId,
          title: makeTitle(conversation[0].content),
          messages: conversation.slice(),
          options: options || [],
          memory: memory || "",
          updatedAt: Date.now(),
        });
        threads.sort(function (a, b) {
          return b.updatedAt - a.updatedAt;
        });
        saveThreads(threads);
        renderThreads();
      }

      function renderThreads() {
        var threads = getThreads();
        if (threads.length === 0) {
          threadListEl.innerHTML = '<p class="history-empty">No saved threads yet.</p>';
          return;
        }
        threadListEl.innerHTML = threads
          .map(function (thread) {
            var activeClass = thread.id === currentThreadId ? " active" : "";
            return (
              '<div class="thread-item' + activeClass + '" data-id="' + thread.id + '">' +
              '<div class="thread-info">' +
              '<div class="thread-title">' + escapeHtml(thread.title || "Untitled") + "</div>" +
              '<div class="thread-time">' + new Date(thread.updatedAt).toLocaleString() + "</div>" +
              "</div>" +
              '<button type="button" class="thread-delete" data-id="' + thread.id + '">Delete</button>' +
              "</div>"
            );
          })
          .join("");

        Array.prototype.forEach.call(threadListEl.querySelectorAll(".thread-item"), function (el) {
          el.addEventListener("click", function () {
            loadThread(el.getAttribute("data-id"));
          });
        });
        Array.prototype.forEach.call(threadListEl.querySelectorAll(".thread-delete"), function (el) {
          el.addEventListener("click", function (e) {
            e.stopPropagation();
            deleteThread(el.getAttribute("data-id"));
          });
        });
      }

      function deleteThread(id) {
        saveThreads(
          getThreads().filter(function (t) {
            return t.id !== id;
          })
        );
        if (id === currentThreadId) {
          startNewThread();
        } else {
          renderThreads();
        }
      }

      function loadThread(id) {
        var thread = getThreads().filter(function (t) {
          return t.id === id;
        })[0];
        if (!thread) return;
        currentThreadId = thread.id;
        conversation = thread.messages.slice();
        currentMemory = thread.memory || "";
        statusEl.className = "";
        statusEl.textContent = "";
        renderTranscript();
        renderMemory();
        renderOptions(thread.options, function (label) {
          sendTurn(label);
        });
        renderThreads();
        messageEl.focus();
      }

      function startNewThread() {
        currentThreadId = generateId();
        conversation = [];
        currentMemory = "";
        statusEl.className = "";
        statusEl.textContent = "";
        optionsEl.innerHTML = "";
        renderTranscript();
        renderMemory();
        renderThreads();
        messageEl.focus();
      }

      function renderTranscript() {
        if (conversation.length === 0) {
          transcriptEl.innerHTML = '<p class="history-empty">No messages yet. Type something to start.</p>';
          return;
        }
        var html = "";
        var startIndex = conversation.length % 2 === 0 ? conversation.length - 2 : conversation.length - 1;
        for (var i = startIndex; i >= 0; i -= 2) {
          var userMsg = conversation[i];
          var assistantMsg = conversation[i + 1];
          html +=
            '<div class="history-item">' +
            '<div class="history-question">' + escapeHtml(userMsg.content) + "</div>" +
            (assistantMsg ? '<div class="history-answer">' + escapeHtml(assistantMsg.content) + "</div>" : "") +
            "</div>";
        }
        transcriptEl.innerHTML = html;
      }

      function renderMemory() {
        if (currentMemory) {
          memoryContentEl.textContent = currentMemory;
          memoryContentEl.className = "";
        } else {
          memoryContentEl.textContent = "No memory yet.";
          memoryContentEl.className = "empty";
        }
      }

      function promptForSecret() {
        var value = window.prompt("Enter your AI Assist passphrase:");
        if (value) {
          localStorage.setItem(SECRET_KEY, value);
        }
        return value;
      }

      function getSecret() {
        var secret = localStorage.getItem(SECRET_KEY);
        if (!secret) {
          secret = promptForSecret();
        }
        return secret;
      }

      settingsEl.addEventListener("click", function () {
        promptForSecret();
      });

      function renderOptions(options, onPick) {
        optionsEl.innerHTML = "";
        (options || []).forEach(function (label) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option";
          btn.textContent = label;
          btn.addEventListener("click", function () {
            Array.prototype.forEach.call(optionsEl.querySelectorAll("button"), function (b) {
              b.disabled = true;
            });
            onPick(label);
          });
          optionsEl.appendChild(btn);
        });
      }

      function sendTurn(userText) {
        var secret = getSecret();
        if (!secret) return;

        if (!currentThreadId) {
          currentThreadId = generateId();
        }
        conversation.push({ role: "user", content: userText });
        optionsEl.innerHTML = "";
        renderTranscript();

        submitEl.disabled = true;
        submitEl.textContent = "Processing...";
        statusEl.className = "";
        statusEl.textContent = "Thinking...";

        var requestHeaders = {
          "Content-Type": "application/json",
          "X-AI-Assist-Secret": secret,
        };
        logDebug("Request \u2192 POST /api/ai-assist-process", {
          headers: requestHeaders,
          body: { memory: currentMemory, message: userText },
        });

        fetch("/api/ai-assist-process", {
          method: "POST",
          headers: requestHeaders,
          body: JSON.stringify({ memory: currentMemory, message: userText }),
        })
          .then(function (response) {
            return response.text().then(function (rawText) {
              var responseHeaders = {};
              response.headers.forEach(function (value, key) {
                responseHeaders[key] = value;
              });
              logDebug("Response \u2190 " + response.status + " " + response.statusText, {
                headers: responseHeaders,
                body: rawText,
              });

              var data;
              try {
                data = rawText ? JSON.parse(rawText) : {};
              } catch (e) {
                data = { error: "Invalid JSON response" };
              }

              if (response.status === 401) {
                localStorage.removeItem(SECRET_KEY);
                statusEl.className = "error";
                statusEl.textContent = "Wrong passphrase. Try again.";
                conversation.pop();
                renderTranscript();
                return null;
              }
              return { ok: response.ok, data: data };
            });
          })
          .then(function (result) {
            if (!result) return;
            if (!result.ok) {
              statusEl.className = "error";
              statusEl.textContent = result.data.details
                ? result.data.error + ": " + result.data.details
                : result.data.error || "Something went wrong.";
              conversation.pop();
              renderTranscript();
              return;
            }
            var action = result.data.action || "(no action returned)";
            statusEl.className = "";
            statusEl.textContent = "";
            currentMemory = result.data.memory || currentMemory;
            conversation.push({ role: "assistant", content: action });
            renderTranscript();
            renderMemory();
            renderOptions(result.data.options, function (label) {
              sendTurn(label);
            });
            persistCurrentThread(result.data.options, currentMemory);
          })
          .catch(function (error) {
            logDebug("Error", error && error.message ? error.message : String(error));
            statusEl.className = "error";
            statusEl.textContent = "Network error. Try again.";
            conversation.pop();
            renderTranscript();
          })
          .finally(function () {
            submitEl.disabled = false;
            submitEl.textContent = "Process";
          });
      }

      function submit() {
        var message = messageEl.value.trim();
        if (!message) return;
        messageEl.value = "";
        sendTurn(message);
      }

      submitEl.addEventListener("click", submit);
      newChatEl.addEventListener("click", startNewThread);
      messageEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
          submit();
        }
      });

      currentThreadId = generateId();
      renderTranscript();
      renderMemory();
      renderThreads();
    </script>
  </body>
</html>
